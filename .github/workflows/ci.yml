name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: .tool-versions
          - name: OTP 27
            otp: "27.3.4"
            elixir: "1.19.6-otp-27"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: matrix.otp == ''
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict
      - if: matrix.otp != ''
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: strict
      - name: Install Swift
        run: |
          archive=swiftly-1.2.0-x86_64.tar.gz
          curl -fsSLO "https://download.swift.org/swiftly/linux/$archive"
          echo "0b26b568811404374c7d7f07276b6aad4145db5d1893a45f307de6a94ca8d9c3  $archive" | sha256sum -c -
          tar zxf "$archive"
          ./swiftly init --assume-yes --no-modify-profile --skip-install --quiet-shell-followup
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --assume-yes --use --post-install-file "$RUNNER_TEMP/swift-post-install.sh" 6.4
          if [ -f "$RUNNER_TEMP/swift-post-install.sh" ]; then
            sudo env DEBIAN_FRONTEND=noninteractive bash "$RUNNER_TEMP/swift-post-install.sh"
          fi
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"
      - run: swiftc --version
      - name: Install Kotlin
        run: |
          archive=kotlin-compiler-2.4.21.zip
          curl -fsSLO "https://github.com/JetBrains/kotlin/releases/download/v2.4.21/$archive"
          echo "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - run: kotlinc -version
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test
      - run: mix bff.compat

  tip:
    needs: test
    if: github.event_name == 'push' && vars.SYNC_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.tip.outputs.latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check that this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/sync.sh tip

  sync:
    needs: tip
    if: needs.tip.outputs.latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sync-${{ matrix.repo }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: next-ios
            task: bff.gen.swift
            out: Next/BFF
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: eyra
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: eyra/${{ matrix.repo }}
          ref: develop
          token: ${{ steps.app.outputs.token }}
          path: target
      - run: mix ${{ matrix.task }} --out target/${{ matrix.out }}
      - name: Check that this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/sync.sh tip
      - name: Compare with the open sync PR, or else develop
        id: diff
        if: steps.tip.outputs.latest == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: eyra/${{ matrix.repo }}
          OUT: ${{ matrix.out }}
        run: ../.github/sync.sh compare
      - name: Close the sync PR, or remove a branch left after a merge
        if: steps.diff.outputs.close == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: eyra/${{ matrix.repo }}
        run: .github/sync.sh close
      - if: steps.diff.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          path: target
          token: ${{ steps.app.outputs.token }}
          base: develop
          branch: mica-bff/sync
          commit-message: Regenerate the BFF code from mica-bff ${{ github.sha }}
          title: Regenerate the BFF code from mica-bff
          body: |
            Generated by `mix ${{ matrix.task }}` from novasoftwarefoundation/mica-bff@${{ github.sha }}. Do not edit these files here: change the spec in mica-bff.

            This PR is updated on every mica-bff change to the generated code until it merges.
