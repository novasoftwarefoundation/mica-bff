name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  # Runs reach the sync in the order their tests finish, not the order of the pushes: only the tip of main
  # may sync, so older code never replaces newer code. Checked in a job of its own, so an older run never
  # joins the sync's concurrency group, where it would replace the newer run's sync.
  tip:
    needs: test
    if: github.event_name == 'push' && vars.SYNC_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.tip.outputs.latest }}
    steps:
      - name: Check that this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $main, not $GITHUB_SHA: only the tip of main syncs."
          fi

  sync:
    needs: tip
    if: needs.tip.outputs.latest == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: sync-${{ matrix.repo }}
      # Wait for a running sync: cancelling it between its branch push and its PR call leaves a branch without a PR.
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: next-ios
            task: bff.gen.swift
            out: Next/BFF
          - repo: mono
            task: bff.gen.elixir
            out: core/mica/systems/bff/blocks
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: eyra
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: eyra/${{ matrix.repo }}
          ref: develop
          token: ${{ steps.app.outputs.token }}
          path: target
      - run: mix ${{ matrix.task }} --out target/${{ matrix.out }}
      # Again, just before the sync: re-running only this job reuses the tip job's earlier answer.
      - name: Check that this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $main, not $GITHUB_SHA: only the tip of main syncs."
          fi
      - name: Compare with the open sync PR, or else develop
        id: diff
        if: steps.tip.outputs.latest == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: eyra/${{ matrix.repo }}
          OUT: ${{ matrix.out }}
        run: |
          beyond_header() {
            [ -n "$(git diff --cached -U0 "$1" -- "$OUT" | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -v 'Generated by mica-bff')" ]
          }
          git add -A
          if git fetch -q origin mica-bff/sync 2>/dev/null; then
            # A branch without an open PR (a cancelled run, a PR closed by hand) is not a sync:
            # compare with it only while its PR is open, else update so the PR opens again.
            # head=eyra:… leaves out PRs from forks with the same branch name.
            open=$(gh api "repos/$REPO/pulls?head=eyra:mica-bff/sync&state=open" --jq length)
            if ! beyond_header HEAD; then
              echo "close=true" >> "$GITHUB_OUTPUT"
            elif [ "$open" = 0 ] || beyond_header FETCH_HEAD; then
              echo "update=true" >> "$GITHUB_OUTPUT"
            fi
          elif beyond_header HEAD; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi
          git reset -q
      - name: Close the sync PR, or remove a branch left after a merge
        if: steps.diff.outputs.close == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: eyra/${{ matrix.repo }}
        run: |
          # Count same-repo PRs only: gh pr close finds a PR by branch name only in the repo itself, not in a fork.
          if [ "$(gh api "repos/$REPO/pulls?head=eyra:mica-bff/sync&state=open" --jq length)" != 0 ]; then
            gh pr close mica-bff/sync -R "$REPO" --delete-branch --comment "mica-bff@${{ github.sha }} generates the same code as develop."
          else
            gh api -X DELETE "repos/$REPO/git/refs/heads/mica-bff/sync"
          fi
      - if: steps.diff.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: target
          token: ${{ steps.app.outputs.token }}
          base: develop
          branch: mica-bff/sync
          commit-message: Regenerate the BFF code from mica-bff ${{ github.sha }}
          title: Regenerate the BFF code from mica-bff
          body: |
            Generated by `mix ${{ matrix.task }}` from novasoftwarefoundation/mica-bff@${{ github.sha }}. Do not edit these files here: change the spec in mica-bff.

            This PR is updated on every mica-bff change to the generated code until it merges.
