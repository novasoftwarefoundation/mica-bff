name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test

  sync:
    needs: test
    if: github.event_name == 'push' && vars.SYNC_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: sync-${{ matrix.repo }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: next-ios
            task: bff.gen.swift
            out: Next/BFF
          - repo: mono
            task: bff.gen.elixir
            out: core/mica/systems/bff/blocks
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: eyra
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/checkout@v4
        with:
          repository: eyra/${{ matrix.repo }}
          ref: develop
          token: ${{ steps.app.outputs.token }}
          path: target
      - run: mix ${{ matrix.task }} --out target/${{ matrix.out }}
      - name: Check for changes beyond the header
        id: diff
        working-directory: target
        run: |
          git add -A
          if git diff --cached -U0 | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -qv 'Generated by mica-bff'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git reset -q
      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          path: target
          token: ${{ steps.app.outputs.token }}
          base: develop
          branch: mica-bff/sync
          commit-message: Regenerate the BFF code from mica-bff ${{ github.sha }}
          title: Regenerate the BFF code from mica-bff
          body: |
            Generated by `mix ${{ matrix.task }}` from novasoftwarefoundation/mica-bff@${{ github.sha }}. Do not edit these files here: change the spec in mica-bff.

            This PR is updated on every mica-bff change to the generated code until it merges.
